<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#ffd0db"/>
    </linearGradient>
    <linearGradient id="favRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#d4325a"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="100%" stop-color="#d99936"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2"/>
  
  <!-- Rose Blossom in Center -->
  <circle cx="32" cy="32" r="18" fill="url(#favRose)"/>
  <circle cx="32" cy="32" r="13" fill="#ffb8c8"/>
  <path d="M 26 31 C 26 37 38 37 38 31 C 38 27 34 25 32 28 C 30 25 26 27 26 31 Z" fill="url(#favRose)"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#favGold)"/>
  
  <!-- Tiny sparkles -->
  <circle cx="16" cy="18" r="2.5" fill="url(#favGold)"/>
  <circle cx="48" cy="16" r="2.5" fill="url(#favGold)"/>
  <circle cx="48" cy="46" r="2" fill="url(#favGold)"/>
  <circle cx="16" cy="46" r="2" fill="url(#favGold)"/>
</svg>
